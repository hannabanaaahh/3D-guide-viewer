<style>
:root {
  --bg: #ffffff; --surface: #f6f7f9; --surface-2: #eceff3; --text: #1d232a; --muted: #5f6b78; --line: #dfe3e8;
  --stage: #ffffff; --accent: var(--guide-accent, #1c7ed6); --on-accent: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --tip: #2f9e44; --tip-bg: #ebfbee; --warn: #e03131; --warn-bg: #fff0f0; --info: #1c7ed6; --info-bg: #e7f5ff;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; --r: 8px; --progress: var(--accent);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #15191e; --surface: #1c2128; --surface-2: #262c35; --text: #e6e9ed; --muted: #9aa5b1; --line: #313945;
    --stage: #1f252d; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --tip: #69db7c; --tip-bg: #1d2e22; --warn: #ff8787; --warn-bg: #352022; --info: #74c0fc; --info-bg: #1a2b3a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191e; --surface: #1c2128; --surface-2: #262c35; --text: #e6e9ed; --muted: #9aa5b1; --line: #313945;
  --stage: #1f252d; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --tip: #69db7c; --tip-bg: #1d2e22; --warn: #ff8787; --warn-bg: #352022; --info: #74c0fc; --info-bg: #1a2b3a;
  color-scheme: dark;
}
/* Whimsy: storybook pastels, polka dots, rainbow progress */
:root[data-theme="whimsy"] {
  --bg: #fffaf0; --surface: #f4effd; --surface-2: #e9e0fb; --text: #2b2340; --muted: #6b5f86; --line: #dccff5;
  --stage: #eef8f6; --stage-bg: radial-gradient(#d9cdf3 1.6px, transparent 1.8px) 0 0 / 22px 22px, linear-gradient(160deg, #e8f7f3, #f6efff 60%, #fff4dc);
  --accent: #7048e8; --accent-2: #12b886; --on-accent: #ffffff; --shadow: 0 2px 0 #dccff5, 0 6px 18px rgba(112,72,232,.12);
  --tip: #0c8a5f; --tip-bg: #e6fcf5; --warn: #d6336c; --warn-bg: #fff0f6; --info: #6741d9; --info-bg: #f3f0ff;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif; --r: 14px;
  --progress: linear-gradient(90deg, #ff8fab, #ffd43b, #69db7c, #4dabf7, #9775fa);
  color-scheme: light;
}
/* Girly pop: bubblegum pink, sparkles, glossy pills */
:root[data-theme="girlypop"] {
  --bg: #fff0f6; --surface: #ffe3ee; --surface-2: #ffd1e3; --text: #4a1036; --muted: #9c3d72; --line: #fbbad6;
  --stage: #ffd6e8; --stage-bg: radial-gradient(#ffffff 1.3px, transparent 1.6px) 0 0 / 18px 18px, radial-gradient(#ffffff 0.9px, transparent 1.2px) 9px 9px / 18px 18px, linear-gradient(160deg, #ffc9de, #f6d5fb 55%, #ffe0ef);
  --accent: #d6336c; --accent-2: #ae3ec9; --on-accent: #ffffff; --shadow: 0 4px 16px rgba(214,51,108,.22);
  --tip: #a61e4d; --tip-bg: #fff0f6; --warn: #c2255c; --warn-bg: #ffdeeb; --info: #9c36b5; --info-bg: #f8f0fc;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif; --r: 16px;
  --progress: linear-gradient(90deg, #f06595, #cc5de8, #f06595);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; }
.gv { display: grid; grid-template-rows: auto 1fr auto; height: 100%; min-height: 0; }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.bar .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.bar .count { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ibtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; flex: none; }
.ibtn:hover { background: var(--surface-2); }
.ibtn:focus-visible, .btn:focus-visible, .toc button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ibtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn[aria-pressed="true"] { background: var(--surface-2); }

/* main area */
.main { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(300px, 380px); grid-template-rows: minmax(0, 1fr); min-height: 0; position: relative; }
.toc { grid-column: 1; grid-row: 1 / -1; }
.stage { grid-column: 2; grid-row: 1; }
.panel { grid-column: 3; grid-row: 1; }
.gv[data-panel="none"] .main { grid-template-columns: auto minmax(0, 1fr); }
.gv[data-panel="none"] .panel { display: none; }
.toc { width: 250px; border-right: 1px solid var(--line); overflow: auto; padding: 8px; background: var(--surface); }
.toc[hidden] { display: none; }
.toc h4 { margin: 12px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.toc button { display: flex; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.toc button:hover { background: var(--surface-2); }
.toc button[aria-current="step"] { background: var(--accent); color: var(--on-accent); }
.toc .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.6em; }
.toc button[aria-current="step"] .n { color: inherit; opacity: .8; }

.stage { position: relative; background: var(--stage-bg, var(--stage)); min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas.overlay { pointer-events: none; }
.tools { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.tools .ibtn { background: var(--bg); border-color: var(--line); box-shadow: var(--shadow); }
.tip-label { position: absolute; pointer-events: none; padding: 3px 8px; border-radius: 6px; background: var(--text); color: var(--bg); font-size: 12px; white-space: nowrap; transform: translate(-50%, -140%); }
.msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
.msg .box { max-width: 420px; }
.msg.drop { outline: 3px dashed var(--accent); outline-offset: -12px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* step panel */
.panel { border-left: 1px solid var(--line); overflow: auto; padding: 16px 18px 24px; min-height: 0; }
.panel .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 2px; }
.panel h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; }
.panel h2 { font-size: 19px; line-height: 1.3; margin: 0 0 10px; }
.panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 8px; }
.panel .sub { color: var(--muted); margin: 0 0 12px; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md img { max-width: 100%; }
.md a { color: var(--accent); }
.md code { background: var(--surface-2); padding: 1px 4px; border-radius: 4px; font-size: .92em; }
.md table { border-collapse: collapse; } .md td, .md th { border: 1px solid var(--line); padding: 3px 8px; }
.note { border-left: 4px solid var(--info); background: var(--info-bg); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.note b { color: var(--info); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.note.tip { border-color: var(--tip); background: var(--tip-bg); } .note.tip b { color: var(--tip); }
.note.warning { border-color: var(--warn); background: var(--warn-bg); } .note.warning b { color: var(--warn); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; background: var(--surface); border-radius: 6px; }
.list li.part { cursor: pointer; } .list li.part:hover { background: var(--surface-2); }
.list .qty { font-weight: 650; font-variant-numeric: tabular-nums; min-width: 2.2em; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.sw.ring { border-radius: 50%; background: none !important; box-shadow: inset 0 0 0 3px currentColor; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.photos button { padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in; background: var(--surface); aspect-ratio: 4/3; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

/* bottom nav */
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.progress { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--progress); width: 0; transition: width .3s; }

/* theme menu */
.theme-wrap { position: relative; flex: none; }
.theme-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 170px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.theme-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; border-radius: calc(var(--r) - 3px); cursor: pointer; text-align: left; }
.theme-menu button:hover, .theme-menu button:focus-visible { background: var(--surface-2); outline: none; }
.theme-menu button::after { content: "✓"; margin-left: auto; visibility: hidden; color: var(--accent); font-weight: 700; }
.theme-menu button[aria-checked="true"]::after { visibility: visible; }
.tsw { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }

/* rounder corners in the playful themes */
.btn, .list li, .photos button, .toc button, .ibtn { border-radius: var(--r); }
.note { border-radius: 0 var(--r) var(--r) 0; }
.btn.primary { border-radius: var(--r); }

/* whimsy flourishes */
[data-theme="whimsy"] .bar { border-bottom: 2px dashed var(--line); }
[data-theme="whimsy"] .nav { border-top: 2px dashed var(--line); }
[data-theme="whimsy"] .bar .title::before { content: "✿ "; color: var(--accent-2); }
[data-theme="whimsy"] .panel h1, [data-theme="whimsy"] .panel h2 { text-decoration: underline wavy var(--accent-2); text-decoration-thickness: 2px; text-underline-offset: 6px; }
[data-theme="whimsy"] .panel h3::before { content: "☆ "; color: var(--accent); }
[data-theme="whimsy"] .progress { height: 10px; border-radius: 5px; }
[data-theme="whimsy"] .btn.primary { box-shadow: 0 3px 0 #5235b8; }
@media (prefers-reduced-motion: no-preference) {
  [data-theme="whimsy"] .btn:not(:disabled):hover { transform: rotate(-1.5deg) scale(1.03); }
  [data-theme="whimsy"] .btn { transition: transform .15s; }
}

/* girly pop flourishes */
[data-theme="girlypop"] .bar, [data-theme="girlypop"] .nav { background: linear-gradient(90deg, #ffe3ee, #f8e1fb); }
[data-theme="girlypop"] .bar .title { font-weight: 800; background: linear-gradient(90deg, #d6336c, #ae3ec9); -webkit-background-clip: text; background-clip: text; color: transparent; }
[data-theme="girlypop"] .bar .title::after { content: " ✨"; color: initial; -webkit-text-fill-color: initial; }
[data-theme="girlypop"] .panel h1, [data-theme="girlypop"] .panel h2 { color: var(--accent); font-weight: 800; }
[data-theme="girlypop"] .panel h3::before { content: "♡ "; }
[data-theme="girlypop"] .btn { border-radius: 999px; }
[data-theme="girlypop"] .btn.primary { background: linear-gradient(135deg, #f06595, #d6336c 50%, #ae3ec9); border-color: transparent; box-shadow: 0 4px 14px rgba(214,51,108,.4), inset 0 1px 0 rgba(255,255,255,.4); }
[data-theme="girlypop"] .progress { height: 10px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); }
[data-theme="girlypop"] .toc button[aria-current="step"] { background: linear-gradient(135deg, #f06595, #ae3ec9); }

.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 16px; z-index: 10; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }
.lightbox[hidden] { display: none; }

.gv[data-panel="bottom"] .main { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: minmax(220px, 58%) minmax(0, 1fr); }
.gv[data-panel="bottom"] .panel { grid-column: 2; grid-row: 2; border-left: 0; border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .main, .gv[data-panel] .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 52%) minmax(0, 1fr); }
  .gv[data-panel="none"] .main { grid-template-rows: minmax(0, 1fr); }
  .stage, .gv[data-panel] .stage { grid-column: 1; grid-row: 1; }
  .panel, .gv[data-panel] .panel { grid-column: 1; grid-row: 2; border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px 20px; }
  .toc { position: absolute; z-index: 5; inset: 0 auto 0 0; width: min(280px, 85%); box-shadow: var(--shadow); }
}
@media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
</style>

async function readGuide(buf) {
  const zip = await JSZip.loadAsync(buf);
  const pj = zip.file('project.json');
  if (!pj) throw new Error('This file is not a Guide Builder project (project.json is missing).');
  const project = normalise(JSON.parse(await pj.async('string')));
  const geoms = new Map(), images = new Map();
  for (const [path, f] of Object.entries(zip.files)) {
    if (path.startsWith('geom/') && path.endsWith('.bin')) geoms.set(path.slice(5, -4), new Float32Array(await f.async('arraybuffer')));
    if (path.startsWith('images/') && path.endsWith('.txt')) {
      const url = (await f.async('string')).trim();
      if (/^data:image\/(png|jpe?g|gif|webp|avif|bmp|svg\+xml)[;,]/i.test(url)) images.set(path.slice(7, -4), url);
    }

  return { project, geoms, images };
}

  p.settings = { accent: '#1c7ed6', renderW: 1600, renderH: 1000, edges: true, ...p.settings };
  p.holeTypes = p.holeTypes || [];

  p.sections = (p.sections || []).filter((s) => s.steps?.length);
  for (const s of p.sections) for (const st of s.steps)
    Object.assign(st, { notes: [], hardware: [], callouts: [], arrows: [], images: [], parts: {}, explode: 0, ...st });

}

  head.position.y = L - headL / 2;

  const fromHash = /(?:^|&)step=(\d+)/.exec(location.hash.slice(1));
  const want = fromHash ? +fromHash[1] : params.has('step') ? +params.get('step') : 0;
  go(Math.max(0, Math.min(total() - 1, want)), false);
  post({ type: 'guide:ready', title: project.meta.title, steps: G.steps.length, intro: hasIntro() });
}

function go(pos, animate = true) {
  pos = Math.max(0, Math.min(total() - 1, pos));
  G.idx = pos;
  const si = stepIndex(pos);
  const intro = si < 0;
  const coverI = Math.max(0, G.steps.findIndex((s) => s.id === G.project.meta.coverStepId));
  const shownI = intro ? (G.project.meta.coverStepId ? coverI : G.steps.length - 1) : si;
  G.s3.show(G.steps[shownI], intro ? new Set() : newIds(shownI), { animate });
  renderPanel(si);
  $('#count').textContent = intro ? `${G.steps.length} steps` : `Step ${si + 1} / ${G.steps.length}`;
  $('#prev').disabled = pos === 0;
  $('#next').disabled = pos === total() - 1;
  $('#next').textContent = intro ? 'Start ▶' : 'Next ▶';
  $('#progress i').style.width = (total() > 1 ? (pos / (total() - 1)) * 100 : 100) + '%';
  $('#progress').setAttribute('aria-valuenow', String(pos));
  $('#progress').setAttribute('aria-valuemax', String(total() - 1));
  document.querySelectorAll('#toc button').forEach((b) => { if (+b.dataset.pos === pos) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
  try { history.replaceState(null, '', '#step=' + pos); } catch {}
  post({ type: 'guide:step', step: pos, index: si, id: intro ? null : G.steps[si].id, title: intro ? G.project.meta.title : G.steps[si].title });
}

function buildToc() {
  const toc = $('#toc');
  toc.replaceChildren();
  let pos = 0;
  if (hasIntro()) toc.append(tocBtn(pos++, '', 'Introduction'));
  let n = 1;
  for (const sec of G.project.sections) {
    if (G.project.sections.length > 1 || sec.title) toc.append(el('h4', {}, sec.title || ''));
    for (const st of sec.steps) toc.append(tocBtn(pos++, n++, st.title || 'Step'));
  }
}
function tocBtn(pos, n, label) {
  return el('button', { 'data-pos': pos, onclick: () => { go(pos); if (matchMedia('(max-width: 860px)').matches) toggleToc(false); } },
    el('span', { class: 'n' }, n), el('span', {}, label));
}
function toggleToc(force) {
  const toc = $('#toc');
  const show = force ?? toc.hidden;
  toc.hidden = !show;
  $('#toc-btn').setAttribute('aria-pressed', String(show));
}

function renderPanel(si) {
  const p = G.project, panel = $('#panel');
  panel.replaceChildren();
  panel.scrollTop = 0;
  if (si < 0) {
    const m = p.meta;
    panel.append(el('h1', {}, m.title || 'Assembly guide'));
    if (m.subtitle) panel.append(el('p', { class: 'sub' }, m.subtitle));
    const bits = [m.author && 'By ' + m.author, m.version && 'Version ' + m.version, m.date].filter(Boolean);
    if (bits.length) panel.append(el('p', { class: 'meta' }, bits.join(' · ')));
    if (m.intro) panel.append(md(m.intro));
    if (m.requirements) panel.append(el('h3', {}, 'You will need'), md(m.requirements));
    const visibleParts = p.parts.filter((pt) => G.steps.some((st) => st.parts[pt.id]?.v));
    if (visibleParts.length) panel.append(el('h3', {}, `Parts (${visibleParts.length})`), partList(groupParts(visibleParts), false));
    const used = new Set(visibleParts.flatMap((pt) => (pt.holes || []).filter((h) => !h.hidden).map((h) => h.type)));
    const types = p.holeTypes.filter((t) => used.has(t.id) && !t.hidden);
    if (types.length) {
      panel.append(el('h3', {}, 'Hole markers'), el('ul', { class: 'list' }, types.map((t) =>
        el('li', {}, el('span', { class: 'sw ring', style: `color:${colorOk(t.color, '#868e96')}` }), el('span', {}, t.name || t.id, t.hardware ? el('span', { class: 'meta' }, ' · ' + t.hardware) : '')))));
    }
    panel.append(el('p', { style: 'margin-top:20px' }, el('button', { class: 'btn primary', onclick: () => go(G.idx + 1) }, 'Start the guide ▶')));
    return;
  }
  const st = G.steps[si];
  const sec = st._section;
  if (sec?.title) panel.append(el('p', { class: 'sec' }, sec.title));
  panel.append(el('h2', {}, `Step ${si + 1}${st.title ? ': ' + st.title : ''}`));
  if (sec && sec.steps[0] === st && sec.intro) panel.append(md(sec.intro), el('hr', { style: 'border:0;border-top:1px solid var(--line);margin:14px 0' }));
  if (st.text) panel.append(md(st.text));
  for (const nt of st.notes || []) {
    if (!nt.text) continue;
    const kind = ['tip', 'warning'].includes(nt.kind) ? nt.kind : 'info';
    const n = el('div', { class: 'note ' + kind }, el('b', {}, { tip: 'Tip', warning: 'Warning', info: 'Note' }[kind]));
    n.append(md(nt.text));
    panel.append(n);
  }
  const np = groupParts(newParts(si));
  if (np.length) panel.append(el('h3', {}, 'Parts'), partList(np, true));
  const hw = (st.hardware || []).filter((x) => x.name);
  if (hw.length) panel.append(el('h3', {}, 'Hardware'), el('ul', { class: 'list' }, hw.map((x) => el('li', {}, el('span', { class: 'qty' }, `${x.qty ?? 1}×`), el('span', {}, x.name)))));
  const imgs = (st.images || []).map((id) => G.images.get(id)).filter(Boolean);
  if (imgs.length) panel.append(el('h3', {}, 'Photos'), el('div', { class: 'photos' }, imgs.map((u, i) =>
    el('button', { 'aria-label': `Open photo ${i + 1}`, onclick: () => openLightbox(u) }, el('img', { src: u, alt: `Photo ${i + 1} for step ${si + 1}`, loading: 'lazy' })))));
}
function partList(groups, clickable) {
  return el('ul', { class: 'list' }, groups.map((g) => el('li', {
    class: clickable ? 'part' : null, title: clickable ? 'Show this part' : null, tabindex: clickable ? 0 : null,
    onclick: clickable ? () => g.ids.forEach((id) => G.s3.flash(id)) : null,
    onkeydown: clickable ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); g.ids.forEach((id) => G.s3.flash(id)); } } : null,
  }, el('span', { class: 'sw', style: `background:${colorOk(g.part.color, '#adb5bd')}` }), el('span', { class: 'qty' }, `${g.qty}×`), el('span', {}, g.part.name || 'Part'))));
}
function openLightbox(url) { const lb = $('#lightbox'); lb.querySelector('img').src = url; lb.hidden = false; }
$('#lightbox').onclick = () => { $('#lightbox').hidden = true; };

// ------------------------------------------------------------------ UI wiring
$('#prev').onclick = () => go(G.idx - 1);
$('#next').onclick = () => go(G.idx + 1);
$('#toc-btn').onclick = () => toggleToc();
$('#reset-btn').onclick = () => G.s3?.resetView();
$('#fit-btn').onclick = () => G.s3?.fitAll();
$('#holes-btn').onclick = (e) => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on));
  if (G.s3) { G.s3.showHoles = on; G.s3._setHoles(); }
};
const fsTarget = document.documentElement;
if (!fsTarget.requestFullscreen) $('#fs-btn').hidden = true;
$('#fs-btn').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : fsTarget.requestFullscreen().catch(() => {}));
document.addEventListener('keydown', (e) => {
  if (!G.project || e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'Escape' && !$('#lightbox').hidden) { $('#lightbox').hidden = true; return; }
  if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && e.target === document.body)) { e.preventDefault(); go(G.idx + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(G.idx - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(total() - 1);
  else if (e.key === 'r' || e.key === 'R') G.s3.resetView();
});

// part names on hover / tap
const stage = $('#stage');
let tipEl = null, down = null;
function showTip(x, y) {
  const id = G.s3?.pick(x, y);
  const part = id && partById(id);
  if (!part) { tipEl?.remove(); tipEl = null; return; }
  if (!tipEl) { tipEl = el('div', { class: 'tip-label' }); stage.append(tipEl); }
  const r = stage.getBoundingClientRect();
  tipEl.textContent = part.name || 'Part';
  tipEl.style.left = x - r.left + 'px'; tipEl.style.top = y - r.top + 'px';
}
let raf = 0;
stage.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse' || e.buttons) { tipEl?.remove(); tipEl = null; return; }
  cancelAnimationFrame(raf); raf = requestAnimationFrame(() => showTip(e.clientX, e.clientY));
});
stage.addEventListener('pointerleave', () => { tipEl?.remove(); tipEl = null; });
stage.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
stage.addEventListener('pointerup', (e) => {
  if (e.pointerType !== 'mouse' && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
    showTip(e.clientX, e.clientY);
    clearTimeout(showTip.t); showTip.t = setTimeout(() => { tipEl?.remove(); tipEl = null; }, 1800);
  }
});

// ------------------------------------------------------------------ open file / drop
function showMessage(html, { open = false } = {}) {
  const m = $('#msg');
  m.hidden = false;
  m.replaceChildren(el('div', { class: 'box' }, ...html, open ? el('p', {}, el('button', { class: 'btn primary', onclick: () => $('#file').click() }, 'Open a .guide file')) : ''));
}
async function openFile(f) {
  if (!f) return;
  showMessage([el('div', { class: 'spinner' }), 'Loading ' + f.name + '…']);
  try { await start(await f.arrayBuffer()); } catch (e) { fail(e); }
}
$('#file').onchange = (e) => { openFile(e.target.files[0]); e.target.value = ''; };
$('#open-btn').onclick = () => $('#file').click();
stage.addEventListener('dragover', (e) => { if (!allowOpen) return; e.preventDefault(); $('#msg').classList.add('drop'); });
stage.addEventListener('dragleave', () => $('#msg').classList.remove('drop'));
stage.addEventListener('drop', (e) => { if (!allowOpen) return; e.preventDefault(); $('#msg').classList.remove('drop'); openFile(e.dataTransfer.files[0]); });
function fail(e) {
  console.error(e);
  showMessage([el('p', {}, el('b', {}, 'Could not open this guide.')), el('p', {}, e.message || String(e))], { open: allowOpen });
}

// ------------------------------------------------------------------ embedding API (postMessage)
const embedded = window.parent !== window;
function post(msg) { if (embedded) window.parent.postMessage(msg, '*'); }
window.addEventListener('message', async (e) => {
  if (!embedded || e.source !== window.parent) return;
  const d = e.data || {};
  if (d.type === 'guide:goto' && G.project) go(+d.step || 0);
  else if (d.type === 'guide:next' && G.project) go(G.idx + 1);
  else if (d.type === 'guide:prev' && G.project) go(G.idx - 1);
  else if (d.type === 'guide:theme') setTheme(String(d.theme), false);
  else if (d.type === 'guide:load') {
    try {
      showMessage([el('div', { class: 'spinner' }), 'Loading…']);
      const buf = d.data instanceof Blob ? await d.data.arrayBuffer() : d.data instanceof ArrayBuffer ? d.data : await fetchGuide(String(d.url));
      await start(buf);
    } catch (err) { fail(err); }
  }
});

// ------------------------------------------------------------------ boot
async function fetchGuide(url) {
  const u = new URL(url, location.href);
  if (!/^https?:$|^blob:$/.test(u.protocol)) throw new Error('Only http(s) addresses can be loaded.');
  let r;
  try { r = await fetch(u); } catch { throw new Error(`Could not download ${u.href}. If it is on another site, that site must allow cross-origin requests (CORS).`); }
  if (!r.ok) throw new Error(`Could not download ${u.href} (HTTP ${r.status}).`);
  return r.arrayBuffer();
}
const inline = $('#guide-data').textContent.trim();
const allowOpen = !inline && !params.get('src');
$('#open-btn').hidden = !allowOpen;
(async () => {
  try {
    if (inline) {
      const bin = atob(inline), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      await start(buf.buffer);
    } else if (params.get('src')) {
      await start(await fetchGuide(params.get('src')));
    } else if (!embedded || params.get('wait') !== '1') {
      showMessage([el('p', {}, el('b', {}, 'Guide Viewer')), el('p', {}, 'Drop a .guide file made with Guide Builder here, or open one.')], { open: true });
    }
  } catch (e) { fail(e); }
})();
</script>
</body>
